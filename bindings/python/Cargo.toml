[package]
name = "internetarchive-python"
version = "0.1.0"
edition = "2024"
description = "Optional PyO3 bindings for internetarchive-core."
license = "AGPL-3.0-or-later"
publish = false
build = "build.rs"

[lib]
name = "internetarchive_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
internetarchive-core = { path = "../..", package = "internetarchive-core" }
pyo3 = { version = "0.23", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = "0.23"
